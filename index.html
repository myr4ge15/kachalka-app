<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (defense-in-depth на статике GitHub Pages, где
      HTTP-заголовки задать нельзя). 'unsafe-inline' для style — из-за inline-
      стилей recharts/SVG; скрипты — только со своего origin. connect-src открыт
      на Supabase: если используете СВОЙ домен Supabase, добавьте его сюда.
      img-src: blob: — для object-URL при выборе аватара (иначе декод файла через
      <img> рубится CSP → «Не удалось прочитать изображение» на ЛЮБОМ фото);
      https://*.supabase.co — чтобы показывать загруженный аватар из Storage.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- user-scalable=no + maximum-scale=1: PWA-приложение, а не страница — двойной
         тап/пинч-зум только ломают вёрстку и мешают быстрым тапам в зале. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <!-- standalone-режим PWA: mobile-web-app-capable (стандарт) + apple-* (iOS Safari
         его до сих пор требует, иначе приложение открывается в обычной вкладке). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kachalka-app" />
    <title>Журнал тренировок</title>
    <!-- Акцент, выбранный в «Профиль → Оформление», — ДО отрисовки сплэша: иначе первый
         кадр мигал бы вольтом. Обычный скрипт, а не инлайн: CSP script-src 'self'. -->
    <script src="./accent-boot.js"></script>
  </head>
  <body>
    <!-- Сплэш холодного старта: виден сразу, до загрузки JS. Стили — в index.css
         (раздел «Сплэш»), убирает main.jsx после первого рендера. Знак — пропорции
         1:1 с public/favicon.svg (512 → 200). -->
    <div id="splash" class="splash" aria-hidden="true">
      <svg class="splash-logo" viewBox="22 22 156 156" focusable="false">
        <defs>
          <linearGradient id="splash-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="splash-stop-1" />
            <stop offset="1" class="splash-stop-2" />
          </linearGradient>
        </defs>
        <g class="splash-lift">
          <rect class="splash-bar" x="37.5" y="93.75" width="125" height="12.5" rx="6.25" />
          <rect class="splash-plate splash-plate--l splash-plate--big" x="59.4" y="68.75" width="13.3" height="62.5" rx="4.7" />
          <rect class="splash-plate splash-plate--r splash-plate--big" x="127.3" y="68.75" width="13.3" height="62.5" rx="4.7" />
          <rect class="splash-plate splash-plate--l splash-plate--small" x="43.75" y="76.6" width="13.3" height="46.9" rx="4.7" />
          <rect class="splash-plate splash-plate--r splash-plate--small" x="143" y="76.6" width="13.3" height="46.9" rx="4.7" />
        </g>
      </svg>
      <p class="splash-title">kachalka-app</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
