# Еженедельная сводка админу в Telegram (П10 «Моего круга», 07.10.2026): Edge tg-summary.
# Понедельник 09:00 МСК = 06:00 UTC. Секреты репозитория: SUMMARY_URL
# (https://<REF>.functions.supabase.co/tg-summary) и WEBHOOK_SECRET (тот же, что у tg-digest).
# Секретов нет — шаг пропускается, workflow не падает.
name: tg-summary
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
# Токену репозитория здесь делать нечего: только curl с секретом.
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 5
    steps:
      - name: Сводка
        env:
          URL: ${{ secrets.SUMMARY_URL }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Нет SUMMARY_URL/WEBHOOK_SECRET — пропускаю"; exit 0; fi
          # Секрет и его производные (хэш, длину) в лог не пишем: логи публичного репо видны всем.
          code=$(curl -sS --max-time 60 -o resp.txt -w '%{http_code}' -X POST -H "x-webhook-secret: $SECRET" "$URL")
          echo "HTTP $code: $(cat resp.txt)"
          [ "$code" = "200" ]
