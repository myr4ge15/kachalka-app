name: Deploy to GitHub Pages

# Публикация инстанса КРУГА ДРУЗЕЙ. Проверки → production-сборка → Pages.
# Ключи Supabase берутся из секретов репозитория (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_KEY (publishable-ключ sb_publishable_...)
# Pages: Settings → Pages → Source = GitHub Actions.
#
# ⚠️ ВЫКАТ ИДЁТ С ТЕГА, А НЕ С main (шаг 1 плана, 03.08.2026).
#
# Раньше любой пуш в main немедленно уезжал пятерым живым людям — это был
# единственный канал поломки клиента и он был всегда открыт. Теперь публикация —
# отдельное осознанное действие:
#
#   git tag v5.14.0 && git push origin v5.14.0
#
# Пуш в main проверяется (test.yml), но НЕ публикуется. Откат на прошлую версию —
# workflow_dispatch с выбором нужного тега в интерфейсе Actions.
#
# ⚠️ Тег легко забыть двигать. Через полгода у друзей 5.13, в main 6.x, и слить
# уже больно. Правило и напоминание — в AGENTS.md, Definition of Done.
#
# ⚠️ ОДНА НАСТРОЙКА ВНЕ РЕПОЗИТОРИЯ. У окружения github-pages по умолчанию стоит
# ограничение «только ветка по умолчанию», и выкат с тега отклоняется с
# «Tag "vX.Y.Z" is not allowed to deploy to github-pages due to environment
# protection rules». Лечится один раз:
#   Settings → Environments → github-pages → Deployment branches and tags →
#   Add deployment branch or tag rule → тип Tag, шаблон v*
# Перетегивать после этого не нужно — достаточно Re-run failed jobs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Права — по задачам (ниже); по умолчанию только чтение.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Предохранитель ДО всего остального (РЕВЬЮ-КОДА-2026-10-02, п. 22):
  #  - выкат только с тега v* — кнопка «Run workflow» по умолчанию стартует с
  #    main и выкатила бы друзьям невыпущенный код (откат = запуск НА ТЕГЕ);
  #  - тег обязан равняться версии из package.json, иначе плашка обновления и
  #    пуш «вышла версия» покажут не ту версию;
  #  - без секретов сборка проходит, но друзья получают экран «Нужна настройка».
  # Плюс (09.10.2026): был ли уже зеленый прогон Tests на этом коммите. Обычно тег
  # ставится на проверенный коммит main — тогда проверки второй раз не гоняем.
  # Плюс (12.10.2026): коммит тега уже есть в main (иначе при тихо упавшем git push
  # друзьям уехал бы код, которого нет в main), а Tests на нем не красный.
  preflight:
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      # Вся история: нужна origin/main для проверки «коммит тега есть в main».
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Коммит тега есть в main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Коммит не в main::${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}) не входит в main. Сначала git push коммита, потом тег."
            exit 1
          fi
          echo "${GITHUB_SHA:0:7} входит в main."

      - name: Тег = версия, секреты заданы
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_REF: ${{ secrets.VITE_SUPABASE_REF }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          node -e "
            const e = process.env, v = 'v' + require('./package.json').version, bad = [];
            if (e.GITHUB_REF_TYPE !== 'tag') bad.push('выкат идет только с тега v* (сейчас: ' + e.GITHUB_REF_NAME + '). Для отката запусти workflow, выбрав нужный тег.');
            else if (e.GITHUB_REF_NAME !== v) bad.push('тег ' + e.GITHUB_REF_NAME + ' не равен версии из package.json (' + v + ').');
            for (const k of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_KEY', 'VITE_VAPID_PUBLIC_KEY']) if (!e[k]) bad.push('не задан секрет ' + k + '.');
            if (bad.length) { console.error(bad.join('\n')); process.exit(1) }
            console.log('Выкат ' + v + ': тег и версия совпадают, секреты на месте.');
          "

      # Ищем прогон test.yml ровно на этом SHA. Тег можно ставить сразу после пуша в
      # main: если Tests на этом коммите еще идет — ждем его (до 15 мин), а не гоняем
      # проверки второй раз. Зеленый — сразу сборка. КРАСНЫЙ (12.10.2026) — выкат
      # останавливаем: иначе повторный прогон «моргающего» теста мог пройти, и уехал бы
      # коммит, на котором main был красным. Чинить — Re-run failed jobs в Tests, затем
      # Re-run этого выката. Отменен или его нет вовсе (коммит только с документацией,
      # старый тег для отката) — проверки прогонит задача tests ниже. Сбой самого
      # запроса = «не нашли»: лучше лишний прогон, чем выкат без проверок.
      - name: Tests зеленый на этом коммите? (подождать, если еще идет)
        id: tested
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&per_page=20"
          tested=false
          red=0
          for i in $(seq 1 60); do
            json=$(gh api "$api" 2>/dev/null || echo '{}')
            total=$(echo "$json" | jq '[.workflow_runs[]?] | length')
            ok=$(echo "$json" | jq '[.workflow_runs[]? | select(.conclusion == "success")] | length')
            live=$(echo "$json" | jq '[.workflow_runs[]? | select(.status != "completed")] | length')
            red=$(echo "$json" | jq '[.workflow_runs[]? | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
            if [ "${ok:-0}" -gt 0 ]; then tested=true; break; fi
            # Пуш в main и тег почти одновременно: прогон Tests может появиться не сразу.
            if [ "${total:-0}" -eq 0 ] && [ "$i" -gt 4 ]; then break; fi
            if [ "${total:-0}" -gt 0 ] && [ "${live:-0}" -eq 0 ]; then break; fi
            [ "$i" -eq 1 ] && echo "Жду Tests на ${GITHUB_SHA:0:7}…"
            sleep 15
          done
          if [ "$tested" != true ] && [ "${red:-0}" -gt 0 ] && [ "${live:-0}" -eq 0 ]; then
            echo "::error title=Tests красный на ${GITHUB_SHA:0:7}::Выкат остановлен. Почини или перезапусти Tests (Re-run failed jobs), затем Re-run этого выката."
            exit 1
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then
            echo "::notice title=Проверки не повторяем::Tests зеленый на ${GITHUB_SHA:0:7} — сразу сборка."
          else
            echo "::notice title=Гоняем проверки::Зеленого Tests на ${GITHUB_SHA:0:7} нет — запускаю test.yml."
          fi

  # Те же проверки, что на пуш в main, — из одного файла, без копипасты.
  tests:
    needs: preflight
    if: needs.preflight.outputs.tested != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Только production-сборка: проверки уже пройдены (здесь или в Tests на main).
  # Контейнер Playwright не нужен — обычный раннер и Node.
  build:
    needs: [preflight, tests]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Set repository variable VITE_APP_BASE to / only when switching the custom domain.
      - name: Build
        env:
          VITE_APP_BASE: ${{ vars.VITE_APP_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_REF: ${{ secrets.VITE_SUPABASE_REF }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Условие обязательно: без него действует неявный success(), а он учитывает и
  # пропущенную задачу tests (Tests уже был зеленым) — выкат молча пропускался (09.10).
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Пуш «вышла новая версия» (v6.7.0, supabase/push-deploy.md). Функция сама читает
      # version.json с сайта и объявляет каждую версию один раз; откат молчит. Сбой
      # рассылки не должен валить деплой — continue-on-error. Секрет PUSH_WEBHOOK_SECRET
      # в Actions = Edge secret PUSH_WEBHOOK_SECRET. Нет секрета — шаг просто пропускается.
      - name: Пуш «вышла новая версия»
        if: success()
        continue-on-error: true
        env:
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        # Любой сбой — предупреждение (::warning::) в сводке выката: раньше нет секрета или
        # отказ функции проглатывались молча, и пуш тихо не уходил несколько релизов подряд.
        run: |
          if [ -z "$PUSH_WEBHOOK_SECRET" ]; then
            echo "::warning title=Пуш о новой версии не отправлен::В Actions нет секрета PUSH_WEBHOOK_SECRET (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          code=$(curl -sS --max-time 120 -o push-update.txt -w '%{http_code}' -X POST \
            -H "x-webhook-secret: $PUSH_WEBHOOK_SECRET" \
            https://lkrrbpbytinrdpfmhxep.functions.supabase.co/push-update || echo 000)
          echo "push-update ответил $code: $(cat push-update.txt 2>/dev/null)"
          case "$code" in
            200|202) ;;
            403) echo "::warning title=Пуш о новой версии не отправлен::push-update ответил 403 — секрет PUSH_WEBHOOK_SECRET в Actions не совпадает с секретом Edge Functions." ;;
            404) echo "::warning title=Пуш о новой версии не отправлен::push-update ответил 404 — функция не задеплоена (supabase functions deploy push-update --no-verify-jwt)." ;;
            401) echo "::warning title=Пуш о новой версии не отправлен::push-update ответил 401 — функция задеплоена без --no-verify-jwt." ;;
            *)   echo "::warning title=Пуш о новой версии не отправлен::push-update ответил $code — смотри логи функции в Supabase." ;;
          esac
