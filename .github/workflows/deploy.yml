name: Deploy to GitHub Pages

# Публикация инстанса КРУГА ДРУЗЕЙ. Проверки → production-сборка → Pages.
# Ключи Supabase берутся из секретов репозитория (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_KEY (publishable-ключ sb_publishable_...)
# Pages: Settings → Pages → Source = GitHub Actions.
#
# ⚠️ ВЫКАТ ИДЁТ С ТЕГА, А НЕ С main (шаг 1 плана, 03.08.2026).
#
# Раньше любой пуш в main немедленно уезжал пятерым живым людям — это был
# единственный канал поломки клиента и он был всегда открыт. Теперь публикация —
# отдельное осознанное действие:
#
#   git tag v5.14.0 && git push origin v5.14.0
#
# Пуш в main проверяется (test.yml), но НЕ публикуется. Откат на прошлую версию —
# workflow_dispatch с выбором нужного тега в интерфейсе Actions.
#
# ⚠️ Тег легко забыть двигать. Через полгода у друзей 5.13, в main 6.x, и слить
# уже больно. Правило и напоминание — в AGENTS.md, Definition of Done.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Smoke build
        run: npx vite build

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e (Playwright)
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
