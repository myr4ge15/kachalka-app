name: Beta (Cloudflare Pages)

# Бета-стенд (19.10.2026, docs/guides/бета-стенд.md): каждый пуш в main после зеленого Tests
# собирается и уезжает на ОТДЕЛЬНЫЙ домен — https://kachalka-beta.pages.dev. Владелец ставит
# его второй PWA на экран «Домой» и проверяет правки на своем iPhone без тега v*.
#
# Друзья бету не видят и ничего о ней не узнают:
#  - их приложение по-прежнему публикует только deploy.yml по тегу v*;
#  - пуш «Вышла версия» отсюда — push-update?app=beta (19.10.2026, у беты свои пуши): функция
#    читает version.json беты (BETA_APP_URL) и шлет только подпискам беты
#    (push_subscriptions.app = 'beta', migrations/20261019230000_push_app_channel.sql);
#    приложение друзей объявляет только deploy.yml по тегу;
#  - домен другой, значит у беты свои localStorage, IndexedDB, кэши, service worker и вход.
#    На github.io бета делила бы все это с основным приложением (один origin).
# Бэкенд Supabase общий: записи с беты — настоящие данные учетки, тестировать под своей.
#
# Сборка беты: VITE_BETA=1 (пометка «БЕТА» в шапке, имя kachalka-beta и иконка с лентой BETA),
# VITE_BETA_BUILD = номер прогона (версия 9.5.10-beta.42 — плашка обновления на бете
# срабатывает на каждом пуше без бампа), VITE_APP_BASE=/ (бета живет в корне домена).
#
# Что нужно вне репозитория (один раз, инструкция — docs/guides/бета-стенд.md):
#   секреты Actions CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) и CLOUDFLARE_ACCOUNT_ID;
#   проект Pages kachalka-beta (Direct Upload, production branch = main). Другое имя
#   проекта — переменная репозитория BETA_PAGES_PROJECT. Без секретов workflow не падает:
#   пишет предупреждение и выходит.
#   Адрес беты — в секрет Edge Functions CORS_ALLOWED_ORIGINS, иначе на бете не войти.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Ручной запуск — выкатить на бету текущий main (первый раз или после сбоя).
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш отменяет недоехавшую сборку прошлого: на бете нужен только свежий main.
concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  beta:
    # Только зеленый Tests на пуше в main (не PR и не прогон из deploy.yml), либо ручной запуск с main.
    if: >-
      ${{ (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'push'
           && github.event.workflow_run.head_branch == 'main')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write  # статус «Beta» на коммите (кружок проверок)
    environment:
      name: beta
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: ${{ vars.BETA_PAGES_PROJECT || 'kachalka-beta' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Секреты Cloudflare заданы?
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Бета не выкачена::Нет секретов CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (docs/guides/бета-стенд.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Статус «Beta» на коммите (19.10.2026). Прогон по workflow_run GitHub к проверкам коммита не
      # привязывает — бета видна только в «All workflows». Ставим статус сами: «идет» сейчас,
      # итог — последним шагом, со ссылкой на бету. Сбой статуса бету не валит.
      - name: Статус «Beta» — идет
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context=Beta \
            -f description="Сборка и выкат на бету" -f target_url="$RUN_URL" > /dev/null

      # Ровно тот коммит, на котором Tests был зеленым, а не «текущий main».
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.cf.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Build (бета)
        if: steps.cf.outputs.ready == 'true'
        env:
          VITE_APP_BASE: /
          VITE_BETA: '1'
          VITE_BETA_BUILD: ${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_REF: ${{ secrets.VITE_SUPABASE_REF }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          npm run build
          # Бету не индексируем: заголовок для всех путей (файл _headers понимает Cloudflare Pages).
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
          echo "Собрана $(node -p "require('./dist/version.json').version") (${SHA:0:7})."

      # Wrangler — точная версия через npx, без стороннего action: меньше движущихся частей.
      - name: Публикация на Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail  # иначе tee проглотит падение wrangler
          npx --yes wrangler@4.146.0 pages deploy dist \
            --project-name="$PROJECT" --branch=main --commit-hash="$SHA" --commit-dirty=true | tee deploy.log
          # Адрес — из ответа wrangler, а не из имени проекта: занятое имя Cloudflare выдает с хвостом
          # (kachalka-beta-xyz.pages.dev). Wrangler печатает адрес сборки https://<хэш>.<проект>.pages.dev,
          # постоянный адрес беты — он же без первой части.
          one=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | tail -1)
          url="https://${one#https://*.}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Бета обновлена::$url — ${SHA:0:7} (эта сборка: $one)"

      # Пуш о бета-сборке — только подпискам беты, по тем же правилам, что у друзей: на смену x.y,
      # «тихая» запись «Что нового» — без пуша. Так на бете проверяется путь «пуш → нажал →
      # обновилось». Сбой рассылки бету не валит.
      - name: Пуш «вышла версия» на бету
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        env:
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PUSH_WEBHOOK_SECRET" ]; then
            echo "::notice title=Пуш беты пропущен::В Actions нет секрета PUSH_WEBHOOK_SECRET."
            exit 0
          fi
          code=$(curl -sS --max-time 120 -o push-update.txt -w '%{http_code}' -X POST \
            -H "x-webhook-secret: $PUSH_WEBHOOK_SECRET" \
            'https://lkrrbpbytinrdpfmhxep.functions.supabase.co/push-update?app=beta' || echo 000)
          echo "push-update (бета) ответил $code: $(cat push-update.txt 2>/dev/null)"
          case "$code" in
            200|202) ;;
            *) echo "::warning title=Пуш беты не отправлен::push-update ответил $code — смотри логи функции в Supabase." ;;
          esac

      - name: Статус «Beta» — итог
        if: always() && steps.cf.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BETA_URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$OUTCOME" = success ] && [ -n "$BETA_URL" ]; then
            state=success; desc="Выкачена: ${BETA_URL#https://}"; url="$BETA_URL"
          else
            state=failure; desc="Бета не выкачена — смотри прогон"; url="$RUN_URL"
          fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context=Beta \
            -f description="$desc" -f target_url="$url" > /dev/null
