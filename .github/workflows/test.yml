name: Tests

# Lint + юнит-тесты (Vitest, два пояса) + smoke-сборка и smoke-e2e (Playwright).
# CI на GitHub Actions делает чистый npm ci, поэтому проблемы песочницы с битым
# node_modules здесь нет. См. docs/plans/PLAN-tests.md.

# С 03.08.2026 `main` НЕ исключается. Раньше его проверял deploy.yml (он же и
# публиковал), но публикация переехала на теги — и без этой правки пуш в main
# остался бы вообще без проверок.
# Теги (v*) сами по себе не гоняем. С 09.10.2026 deploy.yml вызывает ЭТОТ workflow
# (workflow_call) только если на коммите тега еще нет зеленого прогона Tests —
# обычно тег ставится на уже проверенный коммит main, и проверки не повторяются.
# Проверки описаны только здесь: deploy.yml своих шагов lint/test/e2e не держит.
# Коммит только с документацией (README, AGENTS, docs/) Tests не запускает. Тег на таком
# коммите все равно проверится: deploy.yml не найдет прогона и вызовет этот workflow сам.
# docs/quick-start.md — исключение: он вшит в приложение (QuickStartSheet, ?raw).
# Отрицания работают только в `paths` (не в paths-ignore); побеждает последнее совпадение.
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', 'docs/quick-start.md']
  pull_request:
  workflow_call:

# Только чтение кода; при вызове из deploy.yml права и так задает вызывающая задача.
permissions:
  contents: read

jobs:
  # С 09.10.2026 — три параллельные задачи вместо одной цепочки (было ~3 мин подряд):
  # lint, юнит-тесты в двух поясах (matrix) и сборка + e2e. Ждать — по самой долгой.

  lint:
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint

  # Юнит-тесты дважды, ПАРАЛЛЕЛЬНО, в поясах по обе стороны от UTC: Москва (+3, где
  # живут участники) и Лос-Анджелес (−8/−7). Поясные регрессии (день по UTC вместо
  # местного, фикстуры с голой датой) в UTC не видны — РЕВЬЮ-КОДА-2026-10-02, п. 12.
  # Node берет tz-данные из своего ICU, системный tzdata не нужен.
  unit:
    name: unit (${{ matrix.tz }})
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Moscow, America/Los_Angeles]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest)
        env:
          TZ: ${{ matrix.tz }}
        # Покрытие (19.10.2026) — только в московской ноге, чтобы не платить дважды.
        run: npx vitest run ${{ matrix.tz == 'Europe/Moscow' && '--coverage' || '' }}

      - name: Upload coverage report
        if: matrix.tz == 'Europe/Moscow' && !cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Сборка и сквозной путь «вход → тренировка → она в истории после перезагрузки».
  # Образ Playwright: Chromium и системные библиотеки уже внутри (v6.3.3).
  # Версия = @playwright/test из package-lock.json — единственное место, где она записана.
  e2e:
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Версия Playwright совпадает с образом
        run: node -e "const v=require('./node_modules/@playwright/test/package.json').version; if (v !== '1.63.0') { console.error('Образ Playwright 1.63.0, а пакет ' + v + ' — обнови image в test.yml'); process.exit(1) }"

      - name: Smoke build
        run: npx vite build

      # Сети тесту не нужно (офлайн-ветка входа), ключи Supabase подставляет
      # playwright.config.js — секреты в CI не требуются.
      - name: Smoke e2e (Playwright)
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Smoke в WebKit (19.10.2026): друзья на iPhone, а основной e2e — Chromium. Пока
  # информационно: continue-on-error — красный WebKit не останавливает выкат по тегу,
  # пока не разобраны первые расхождения. PWA «на экране Домой» WebKit не эмулирует.
  e2e-webkit:
    runs-on: ubuntu-24.04  # закреплено 15.10.2026: ubuntu-latest с 19.10 → Ubuntu 26 (runner-images#14748)
    timeout-minutes: 20
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Smoke e2e (WebKit)
        env:
          E2E_WEBKIT: '1'
        run: npx playwright test --project=webkit
