name: Tests

# Юнит-тесты чистого слоя (Vitest) + smoke-сборка + smoke-e2e (Playwright).
# CI на GitHub Actions делает чистый npm ci, поэтому проблемы песочницы с битым
# node_modules здесь нет. См. docs/PLAN-tests.md.

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Smoke build
        run: npx vite build

      # Сквозной путь «вход → тренировка → она в истории после перезагрузки».
      # Ставим только chromium: браузер один, качать остальные — минуты впустую.
      # Сети тесту не нужно (офлайн-ветка входа), ключи Supabase подставляет
      # playwright.config.js — секреты в CI не требуются.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e (Playwright)
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
