name: Tests

# Юнит-тесты чистого слоя (Vitest) + smoke-сборка + smoke-e2e (Playwright).
# CI на GitHub Actions делает чистый npm ci, поэтому проблемы песочницы с битым
# node_modules здесь нет. См. docs/PLAN-tests.md.

# С 03.08.2026 `main` НЕ исключается. Раньше его проверял deploy.yml (он же и
# публиковал), но публикация переехала на теги — и без этой правки пуш в main
# остался бы вообще без проверок.
# Теги (v*) не гоняем: их проверяет deploy.yml перед выкладкой — раньше на пуш тега
# запускались оба workflow с одними и теми же проверками (v6.3.3).
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Образ Playwright: Chromium и системные библиотеки уже внутри (v6.3.3).
    # Версия = @playwright/test из package-lock.json (см. deploy.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Версия Playwright совпадает с образом
        run: node -e "const v=require('./node_modules/@playwright/test/package.json').version; if (v !== '1.61.1') { console.error('Образ Playwright 1.61.1, а пакет ' + v + ' — обнови image в deploy.yml и test.yml'); process.exit(1) }"

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      # Второй прогон под чужим поясом (UTC−8/−7): раннер CI живет в UTC, и
      # поясные регрессии (день по UTC вместо местного, фикстуры с голой датой)
      # иначе не ловятся — РЕВЬЮ-КОДА-2026-10-02, п. 12 и «Мелочи». Node берет
      # tz-данные из своего ICU, системный tzdata в образе не нужен.
      - name: Unit tests (Vitest, TZ=America/Los_Angeles)
        run: TZ=America/Los_Angeles npx vitest run

      - name: Smoke build
        run: npx vite build

      # Сквозной путь «вход → тренировка → она в истории после перезагрузки».
      # Сети тесту не нужно (офлайн-ветка входа), ключи Supabase подставляет
      # playwright.config.js — секреты в CI не требуются.
      - name: Smoke e2e (Playwright)
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
